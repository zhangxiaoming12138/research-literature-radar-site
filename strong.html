<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>关键词文献雷达</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe4ea;--brand:#2348a5;--soft:#eef3ff;--good:#137a55;--warn:#a15c00;--bad:#b42318;--shadow:#182c5010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Arial,"Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#172554,#2348a5);color:#fff}.wrap{max-width:1320px;margin:auto;padding:22px 18px}.hero{padding:30px 18px 24px}.hero h1{font-size:30px;margin:0 0 6px}.hero p{margin:0;opacity:.84}.stats{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-top:18px}.stat{background:#ffffff17;border:1px solid #ffffff2d;border-radius:12px;padding:11px}.stat b{font-size:21px;display:block}
.pipeline{margin-top:13px;background:#ffffff12;border:1px solid #ffffff30;border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pipeline strong{font-size:13px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;background:#d0d5dd}.dot.healthy{background:#5ee0a4}.dot.degraded{background:#ffc15a}.dot.failed{background:#ff7a70}.source{font-size:12px;opacity:.9}
.views{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0 10px}.view{border:1px solid #cbd4e5;background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer}.view.active{background:var(--brand);border-color:var(--brand);color:#fff}.view strong{margin-left:4px}
.toolbar{display:grid;grid-template-columns:2fr repeat(3,minmax(150px,.7fr));gap:10px;margin:10px 0}.toolbar input,.toolbar select,.actions button{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;color:var(--text)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.actions button{width:auto;cursor:pointer}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 16px}.chip{border:1px solid #cbd4e5;background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer}.chip.active{background:var(--brand);border-color:var(--brand);color:#fff}.meta{color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px var(--shadow)}.card.ignored{opacity:.55}.top{display:flex;justify-content:space-between;gap:10px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--muted)}.badge.good{color:var(--good);border-color:#a9dec9;background:#effaf6}.badge.warn{color:var(--warn);border-color:#f1d1a8;background:#fff8ec}.score{font-weight:700;color:var(--brand);white-space:nowrap}h2{font-size:17px;line-height:1.38;margin:10px 0 3px}.zh-title{font-size:14px;font-weight:600;color:#3b465a;margin:0 0 7px}.zh-title.na{font-weight:400;color:var(--muted)}.card a{color:inherit;text-decoration:none}.card a:hover{color:var(--brand)}.by,.rank{color:var(--muted);font-size:12.5px}.rank{margin-top:4px}.abstract{margin:9px 0;color:#3d4658;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.label{font-size:11px;color:var(--muted);margin-top:8px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}.tag{font-size:11px;background:var(--soft);color:#34509a;border-radius:999px;padding:3px 7px}.keyword{background:#f7f1ff;color:#6938a8}.why{margin-top:9px;border-top:1px solid #edf0f4;padding-top:8px}.why summary{cursor:pointer;color:#344054;font-weight:600}.why p{color:#475467;margin:7px 0 0}.paper-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.paper-actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;cursor:pointer;font-size:12px}.paper-actions button.on{background:var(--soft);border-color:#9db3ef;color:var(--brand)}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px}.doi{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%}.pager{display:flex;justify-content:center;align-items:center;gap:10px;padding:24px 0}.pager button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted)}
@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:1fr}}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}.grid{grid-template-columns:minmax(0,1fr)}.card{padding:13px}}
</style>
</head>
<body data-default-view="strong">
<header><div class="wrap hero"><h1>关键词文献雷达</h1><p>双频整流天线 · 无源反向散射温度传感 · 多端口能量采集</p><div class="stats"><div class="stat"><b id="total">—</b>累计文献</div><div class="stat"><b id="newToday">—</b>今日新增</div><div class="stat"><b id="sinceVisit">—</b>上次访问以来</div><div class="stat"><b id="strongCount">—</b>强相关</div><div class="stat"><b id="mustCount">—</b>我的必读</div></div><div class="pipeline" id="pipeline"></div></div></header>
<main class="wrap">
<div class="views" id="views"><button class="view" data-view="all">全部文献</button><button class="view" data-view="strong">强相关</button><button class="view" data-view="today">今日新增</button><button class="view" data-view="since">访问以来新增</button><button class="view" data-view="must">我的必读</button><button class="view" data-view="read">已读</button><button class="view" data-view="ignored">已忽略</button></div>
<div class="toolbar"><input id="q" placeholder="搜索 title / 中文标题 / keyword / DOI / 期刊 …"><select id="year"><option value="">全部年份</option><option value="2026">2026</option><option value="2025">2025</option><option value="5y">近 5 年</option><option value="10y">近 10 年</option></select><select id="filter"><option value="all">全部 OA 状态</option><option value="oa">仅 OA</option></select><select id="sort"><option value="score">相关性评分</option><option value="newest">最新发表</option><option value="seen">最近发现</option><option value="oldest">最早发表</option></select></div>
<div class="actions"><button id="exportFeedback">导出我的反馈 JSON</button><button id="clearFilters">清空筛选</button></div>
<div class="chips" id="chips"></div><div class="meta"><span id="resultCount">载入中…</span><span id="updated"></span></div><div id="grid" class="grid"></div><div class="pager"><button id="prev">上一页</button><span id="pageInfo"></span><button id="next">下一页</button></div>
</main>
<script>
const PAGE=60;let db=null,page=1,topic='',view=document.body.dataset.defaultView||'all',previousVisit=null;
const STATE_KEY='literatureRadar.paperState.v1',VISIT_KEY='literatureRadar.lastVisit.v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function loadState(){try{return JSON.parse(localStorage.getItem(STATE_KEY)||'{}')}catch{return {}}}let userState=loadState();function saveState(){localStorage.setItem(STATE_KEY,JSON.stringify(userState))}
function stateFor(k){return userState[k]||{reading:'',relevance:''}}function ts(s){const n=Date.parse(s||'');return Number.isFinite(n)?n:0}function pubTs(p){return ts(p.publication_date)||(Number(p.year)||0)*31557600000}function isToday(s){if(!s)return false;const d=new Date(s),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}function sinceLast(p){return previousVisit?ts(p.first_seen)>previousVisit:false}
function viewMatch(p){const st=stateFor(p.key);if(view==='strong')return !!p.is_strong;if(view==='today')return isToday(p.first_seen);if(view==='since')return sinceLast(p);if(view==='must')return st.reading==='must';if(view==='read')return st.reading==='read';if(view==='ignored')return st.reading==='ignored';return st.reading!=='ignored'}
function matches(p){if(!viewMatch(p))return false;const q=$('#q').value.trim().toLowerCase();if(q){const hay=[p.title,p.title_zh,p.abstract,p.venue,(p.authors||[]).join(' '),(p.tags||[]).join(' '),(p.matched_keywords||[]).join(' '),(p.topics||[]).join(' '),p.relevance_reason,p.doi,p.jcr_quartile,p.cas_zone].join(' ').toLowerCase();if(!hay.includes(q))return false}if(topic&&!(p.topics||[]).includes(topic))return false;const y=$('#year').value,py=Number(p.year)||0,now=new Date().getFullYear();if(y==='5y'&&py<now-4)return false;if(y==='10y'&&py<now-9)return false;if(/^20\d\d$/.test(y)&&py!==Number(y))return false;if($('#filter').value==='oa'&&!p.oa)return false;return true}
function rows(){const r=db.items.filter(matches);const s=$('#sort').value;r.sort((a,b)=>s==='score'?(b.score-a.score)||pubTs(b)-pubTs(a):s==='seen'?ts(b.last_seen)-ts(a.last_seen):s==='oldest'?pubTs(a)-pubTs(b):pubTs(b)-pubTs(a)||b.score-a.score);return r}
function actionButton(p,action,label,on){return `<button data-key="${esc(p.key)}" data-action="${action}" class="${on?'on':''}">${label}</button>`}
function card(p){const st=stateFor(p.key),zh=p.title_zh&&p.title_zh!=='N/A'?esc(p.title_zh):'中文标题：N/A（待可靠翻译）';return `<article class="card ${st.reading==='ignored'?'ignored':''}"><div class="top"><div class="badges"><span class="badge">${esc(p.classification||'未分类')}</span>${p.oa?'<span class="badge good">OA</span>':''}${p.is_strong?'<span class="badge good">强相关</span>':''}${st.relevance==='up'?'<span class="badge good">👍 已标相关</span>':''}${st.relevance==='down'?'<span class="badge warn">👎 已标不相关</span>':''}</div><span class="score">匹配度 ${p.score}%</span></div><h2><a href="${esc(p.link)}" target="_blank" rel="noreferrer">${esc(p.title)}</a></h2><div class="zh-title ${p.title_zh==='N/A'?'na':''}">${zh}</div><div class="by">${esc((p.authors||[]).slice(0,5).join(', '))}${p.authors?.length>5?' et al.':''} · ${esc(p.venue||'未知来源')} · ${esc(p.publication_date||p.year||'')}</div><div class="rank">JCR ${esc(p.jcr_quartile||'N/A')} · 中科院 ${esc(p.cas_zone||'N/A')} · 年份 ${esc(p.ranking_year||'N/A')} · 来源 ${esc(p.ranking_source||'N/A')}</div>${p.abstract?`<div class="abstract">${esc(p.abstract)}</div>`:''}<div class="label">命中 keyword</div><div class="tags">${(p.matched_keywords||[]).slice(0,12).map(x=>`<span class="tag keyword">${esc(x)}</span>`).join('')||'<span class="by">无明确命中词</span>'}</div><div class="label">研究标签</div><div class="tags">${(p.tags||[]).slice(0,10).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><details class="why"><summary>为什么相关</summary><p>${esc(p.relevance_reason||'N/A')}</p></details><div class="paper-actions">${actionButton(p,'must','☆ 必读',st.reading==='must')}${actionButton(p,'read','✓ 已读',st.reading==='read')}${actionButton(p,'ignored','× 忽略',st.reading==='ignored')}${actionButton(p,'up','👍 相关',st.relevance==='up')}${actionButton(p,'down','👎 不相关',st.relevance==='down')}</div><div class="foot"><span class="doi">${esc(p.doi?`DOI: ${p.doi}`:'')}</span>${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noreferrer">打开论文 ↗</a>`:''}</div></article>`}
function render(scroll=true){const r=rows(),pages=Math.max(1,Math.ceil(r.length/PAGE));page=Math.min(Math.max(1,page),pages);const rowsNow=r.slice((page-1)*PAGE,page*PAGE);$('#resultCount').textContent=`当前筛选：${r.length.toLocaleString()} 篇`;$('#pageInfo').textContent=`${page} / ${pages}`;$('#prev').disabled=page<=1;$('#next').disabled=page>=pages;$('#grid').innerHTML=rowsNow.length?rowsNow.map(card).join(''):'<div class="empty">没有符合当前筛选条件的文献。</div>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>updatePaperState(b.dataset.key,b.dataset.action));document.querySelectorAll('.view').forEach(b=>b.classList.toggle('active',b.dataset.view===view));updateStats();if(scroll)window.scrollTo({top:document.querySelector('main').offsetTop-10,behavior:'smooth'})}
function updatePaperState(key,action){const st={...stateFor(key)};if(['must','read','ignored'].includes(action))st.reading=st.reading===action?'':action;if(action==='up')st.relevance=st.relevance==='up'?'':'up';if(action==='down')st.relevance=st.relevance==='down'?'':'down';if(!st.reading&&!st.relevance)delete userState[key];else userState[key]=st;saveState();render(false)}
function updateStats(){const states=Object.values(userState);$('#total').textContent=db.total.toLocaleString();$('#newToday').textContent=db.items.filter(p=>isToday(p.first_seen)).length.toLocaleString();$('#sinceVisit').textContent=db.items.filter(sinceLast).length.toLocaleString();$('#strongCount').textContent=(db.strong_total??db.items.filter(p=>p.is_strong).length).toLocaleString();$('#mustCount').textContent=states.filter(s=>s.reading==='must').length.toLocaleString()}
function pipelineHtml(){const p=db.pipeline||{},status=p.status||'unknown',source=Object.entries(p.source_health||{}).map(([k,v])=>`<span class="source"><i class="dot ${esc(v)}"></i>${esc(k)} ${esc(v)}</span>`).join('');const label=status==='healthy'?'Pipeline Healthy':status==='degraded'?'Pipeline Degraded':status==='failed'?'Pipeline Failed':'Pipeline Unknown';return `<strong><i class="dot ${esc(status)}"></i>${label}</strong><span class="source">Last successful update: ${esc(p.last_successful_at==='N/A'?'N/A':new Date(p.last_successful_at).toLocaleString('zh-CN'))}</span><span class="source">Last attempt: ${esc(p.last_attempt_at==='N/A'?'N/A':new Date(p.last_attempt_at).toLocaleString('zh-CN'))}</span>${source}`}
function setup(){const raw=localStorage.getItem(VISIT_KEY);previousVisit=raw?Number(raw):Date.now();if(!Number.isFinite(previousVisit))previousVisit=Date.now();$('#pipeline').innerHTML=pipelineHtml();$('#updated').textContent=`网站生成：${new Date(db.generated_at).toLocaleString('zh-CN')} · 索引数据：${new Date(db.data_updated_at).toLocaleString('zh-CN')}`;$('#chips').innerHTML='<button class="chip active" data-topic="">全部主题</button>'+Object.entries(db.topics||{}).map(([k,v])=>`<button class="chip" data-topic="${esc(k)}">${esc(v)}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));page=1;render()});document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{view=b.dataset.view;page=1;render()});['q','year','filter','sort'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',()=>{page=1;render()}));$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};$('#clearFilters').onclick=()=>{$('#q').value='';$('#year').value='';$('#filter').value='all';topic='';view='all';document.querySelectorAll('.chip').forEach((x,i)=>x.classList.toggle('active',i===0));page=1;render()};$('#exportFeedback').onclick=exportFeedback;const qp=new URLSearchParams(location.search);if(qp.get('q'))$('#q').value=qp.get('q');if(qp.get('view'))view=qp.get('view');render(false);localStorage.setItem(VISIT_KEY,String(Date.now()))}
function exportFeedback(){const payload={schema_version:1,exported_at:new Date().toISOString(),items:userState};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`literature-radar-feedback-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
fetch('papers.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(x=>{db=x;setup()}).catch(e=>{$('#grid').innerHTML='<div class="empty">数据载入失败，请稍后刷新。</div>';console.error(e)});
</script></body></html>
