<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>关键词文献雷达</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe4ea;--brand:#2348a5;--soft:#eef3ff;--good:#137a55}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Arial,"Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#172554,#2348a5);color:#fff}.wrap{max-width:1240px;margin:auto;padding:24px 18px}.hero{padding:32px 18px 26px}.hero h1{font-size:30px;margin:0 0 6px}.hero p{margin:0;opacity:.82}.stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-top:20px}.stat{background:#ffffff17;border:1px solid #ffffff2d;border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.toolbar{display:grid;grid-template-columns:2fr repeat(3,minmax(150px,.7fr));gap:10px;margin:18px 0 10px}.toolbar input,.toolbar select{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;color:var(--text)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 18px}.chip{border:1px solid #cbd4e5;background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer}.chip.active{background:var(--brand);border-color:var(--brand);color:#fff}.meta{color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px #182c5010}.top{display:flex;justify-content:space-between;gap:10px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--muted)}.badge.good{color:var(--good);border-color:#a9dec9;background:#effaf6}.score{font-weight:700;color:var(--brand)}h2{font-size:17px;line-height:1.38;margin:10px 0 6px}.card a{color:inherit;text-decoration:none}.card a:hover{color:var(--brand)}.by{color:var(--muted);font-size:12.5px}.abstract{margin:10px 0;color:#3d4658;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{font-size:11px;background:var(--soft);color:#34509a;border-radius:999px;padding:3px 7px}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.doi{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%}.pager{display:flex;justify-content:center;align-items:center;gap:10px;padding:24px 0}.pager button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted)}
@media(max-width:850px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>
</head>
<body>
<header><div class="wrap hero"><h1>关键词文献雷达</h1><p>双频整流天线 · 无源反向散射温度传感 · 多端口能量采集</p><div class="stats"><div class="stat"><b id="total">—</b>累计文献</div><div class="stat"><b id="newToday">—</b>最近 24 h 新增</div><div class="stat"><b id="oaCount">—</b>开放获取</div><div class="stat"><b id="relevantCount">—</b>高相关候选</div></div></div></header>
<main class="wrap">
<div class="toolbar"><input id="q" placeholder="输入 keyword：rectenna / backscatter / polarization / 2.45 GHz …"><select id="year"><option value="">全部年份</option><option value="2026">2026</option><option value="2025">2025</option><option value="5y">近 5 年</option><option value="10y">近 10 年</option></select><select id="filter"><option value="all">全部结果</option><option value="relevant">仅高相关</option><option value="oa">仅 OA</option></select><select id="sort"><option value="newest">最新发表</option><option value="score">相关性评分</option><option value="seen">最近发现</option><option value="oldest">最早发表</option></select></div>
<div class="chips" id="chips"></div><div class="meta"><span id="resultCount">载入中…</span><span id="updated"></span></div><div id="grid" class="grid"></div><div class="pager"><button id="prev">上一页</button><span id="pageInfo"></span><button id="next">下一页</button></div>
</main>
<script>
const PAGE=80;let db=null,page=1,topic='';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ts(s){const n=Date.parse(s||'');return Number.isFinite(n)?n:0}function pubTs(p){return ts(p.publication_date)||(Number(p.year)||0)*31557600000}
function matches(p){const q=$('#q').value.trim().toLowerCase();if(q){const hay=[p.title,p.abstract,p.venue,(p.authors||[]).join(' '),(p.tags||[]).join(' '),(p.topics||[]).join(' '),p.doi].join(' ').toLowerCase();if(!hay.includes(q))return false}if(topic&&!(p.topics||[]).includes(topic))return false;const y=$('#year').value,py=Number(p.year)||0,now=new Date().getFullYear();if(y==='5y'&&py<now-4)return false;if(y==='10y'&&py<now-9)return false;if(/^20\d\d$/.test(y)&&py!==Number(y))return false;const f=$('#filter').value;if(f==='relevant'&&!p.eligible)return false;if(f==='oa'&&!p.oa)return false;return true}
function rows(){const r=db.items.filter(matches);const s=$('#sort').value;r.sort((a,b)=>s==='score'?(b.score-a.score)||pubTs(b)-pubTs(a):s==='seen'?ts(b.last_seen)-ts(a.last_seen):s==='oldest'?pubTs(a)-pubTs(b):pubTs(b)-pubTs(a)||b.score-a.score);return r}
function render(){const r=rows(),pages=Math.max(1,Math.ceil(r.length/PAGE));page=Math.min(page,pages);const view=r.slice((page-1)*PAGE,page*PAGE);$('#resultCount').textContent=`当前筛选：${r.length.toLocaleString()} 篇`;$('#pageInfo').textContent=`${page} / ${pages}`;$('#prev').disabled=page<=1;$('#next').disabled=page>=pages;$('#grid').innerHTML=view.length?view.map(p=>`<article class="card"><div class="top"><div class="badges"><span class="badge">${esc(p.classification||'未分类')}</span>${p.oa?'<span class="badge good">OA</span>':''}${p.eligible?'<span class="badge good">高相关</span>':''}</div><span class="score">${p.score}/100</span></div><h2><a href="${esc(p.link)}" target="_blank" rel="noreferrer">${esc(p.title)}</a></h2><div class="by">${esc((p.authors||[]).slice(0,5).join(', '))}${p.authors?.length>5?' et al.':''} · ${esc(p.venue||'未知来源')} · ${esc(p.publication_date||p.year||'')}</div>${p.abstract?`<div class="abstract">${esc(p.abstract)}</div>`:''}<div class="tags">${(p.tags||[]).slice(0,10).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="foot"><span class="doi">${esc(p.doi?`DOI: ${p.doi}`:'')}</span><a href="${esc(p.link)}" target="_blank" rel="noreferrer">打开论文 ↗</a></div></article>`).join(''):'<div class="empty">没有符合当前筛选条件的文献。</div>';window.scrollTo({top:document.querySelector('main').offsetTop-10,behavior:'smooth'})}
function setup(){const cutoff=Date.now()-86400000;$('#total').textContent=db.total.toLocaleString();$('#newToday').textContent=db.items.filter(p=>ts(p.first_seen)>=cutoff).length.toLocaleString();$('#oaCount').textContent=db.items.filter(p=>p.oa).length.toLocaleString();$('#relevantCount').textContent=db.items.filter(p=>p.eligible).length.toLocaleString();$('#updated').textContent=`数据更新：${new Date(db.generated_at).toLocaleString('zh-CN')}`;$('#chips').innerHTML='<button class="chip active" data-topic="">全部主题</button>'+Object.entries(db.topics).map(([k,v])=>`<button class="chip" data-topic="${esc(k)}">${esc(v)}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));page=1;render()});['q','year','filter','sort'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',()=>{page=1;render()}));$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};const qp=new URLSearchParams(location.search).get('q');if(qp)$('#q').value=qp;render()}
fetch('papers.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{db=x;setup()}).catch(e=>{$('#grid').innerHTML='<div class="empty">数据载入失败，请稍后刷新。</div>';console.error(e)});
</script></body></html>
